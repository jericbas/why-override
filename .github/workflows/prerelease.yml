name: Publish Prerelease

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag (e.g. beta, alpha, next, canary)'
        required: true
        type: choice
        options:
          - beta
          - alpha
          - next
          - canary
          - rc
        default: 'beta'
      bump_type:
        description: 'Version bump strategy'
        required: true
        type: choice
        options:
          - prerelease
          - prepatch
          - preminor
          - premajor
          - canary-sha
        default: 'prerelease'
      dry_run:
        description: 'Dry run (build and test pack without publishing)'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  prerelease:
    name: Build & Publish Prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install

      - name: Bump package version
        id: bump
        run: |
          DIST_TAG="${{ inputs.dist_tag }}"
          BUMP="${{ inputs.bump_type }}"

          if [ "$BUMP" = "canary-sha" ]; then
            BASE_VERSION=$(node -p "require('./packages/why-override/package.json').version.split('-')[0]")
            SHORT_SHA=$(git rev-parse --short HEAD)
            TARGET_VERSION="${BASE_VERSION}-${DIST_TAG}.${SHORT_SHA}"
            npm version "$TARGET_VERSION" --workspace=packages/why-override --no-git-tag-version --allow-same-version
          else
            npm version "$BUMP" --preid="$DIST_TAG" --workspace=packages/why-override --no-git-tag-version
          fi

          RESOLVED_VERSION=$(node -p "require('./packages/why-override/package.json').version")
          echo "version=$RESOLVED_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved prerelease version: $RESOLVED_VERSION (npm tag: $DIST_TAG)"

      - name: Build CLI
        run: bun run build

      - name: Dry run verification
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run mode active. Verifying package tarball without publishing..."
          npm pack --dry-run --workspace=packages/why-override
          echo "Dry run successful for why-override@${{ steps.bump.outputs.version }} (--tag ${{ inputs.dist_tag }})"

      - name: Publish to npm with retry
        if: ${{ !inputs.dry_run }}
        run: |
          DIST_TAG="${{ inputs.dist_tag }}"
          for i in 1 2 3; do
            echo "Attempt $i to publish why-override@${{ steps.bump.outputs.version }} with tag '$DIST_TAG'..."
            if npm publish --workspace=packages/why-override --access public --tag "$DIST_TAG" --provenance; then
              echo "Published successfully on attempt $i"
              exit 0
            fi
            echo "Publish attempt $i failed. Waiting 15 seconds before retrying..."
            sleep 15
          done
          echo "Failed to publish after 3 attempts."
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

